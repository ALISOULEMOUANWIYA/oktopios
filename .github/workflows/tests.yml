name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances (coeur + tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Lancer la suite de tests
        run: pytest tests/ -q

  test-extras:
    # Vérifie séparément que les extras (data/recognition/ia) s'installent
    # sans casser — ce sont les dépendances les plus lourdes/fragiles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avec tous les extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest

      - name: Lancer la suite de tests (avec extras installés)
        run: pytest tests/ -q
