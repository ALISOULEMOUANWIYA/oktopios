[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oktopios"
version = "0.0.11"
description = "Oktopios — un langage de programmation moderne et expressif"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Mouanwiya Ali Soule" }]
keywords = ["language", "programming", "interpreter", "oktopios", "okp"]
dependencies = [
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
    "psutil>=5.9",
]

[project.scripts]
okp = "vm.main:main"
okp-setup = "vm.post_install:run_post_install"

[tool.setuptools.packages.find]
where = ["."]
include = ["vm*"]

[tool.setuptools.package-data]
"vm" = ["modules/*.okp", "heart/*.py", "assets/icons/*.png", "assets/icons/*.ico"]
