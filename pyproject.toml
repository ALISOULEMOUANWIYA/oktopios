[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oktopios"
version = "0.1.7"
description = "Oktopios - un langage de programmation moderne, expressif et bio-inspire"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Mouanwiya Ali Soule" }]
keywords = ["language", "programming", "interpreter", "oktopios", "okp"]
dependencies = [
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# DataImport (json/excel/sql/mysql)
data = ["openpyxl>=3.1", "pymysql>=1.1"]
# Recognize (faciale/vocale)
recognition = ["opencv-contrib-python-headless>=4.8", "librosa>=0.10", "soundfile>=0.12"]
# IAModule (Ollama/DeepSeek/StarCoder)
ia = ["requests>=2.31"]
# Tout d'un coup, pour les fanatiques qui veulent tout essayer
all = ["oktopios[data,recognition,ia]"]

[project.scripts]
okp = "vm.main:main"
okp-setup = "vm.post_install:run_post_install"

[tool.setuptools.packages.find]
where = ["."]
include = ["vm*"]

[tool.setuptools.package-data]
"vm" = ["modules/*.okp", "heart/*.py", "assets/icons/*.png", "assets/icons/*.ico"]
