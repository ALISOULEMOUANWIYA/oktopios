[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oktopios"
version = "0.0.1"
description = "Oktopios — un langage de programmation moderne et expressif 🐙"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Mouanwiya Ali Soule" }
]
keywords = ["language", "programming", "interpreter", "oktopios", "okp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Interpreters",
    "Intended Audience :: Developers",
]
dependencies = [
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
    "camelcase>=0.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/ALISOULEMOUANWIYA/oktopios"
Issues   = "https://github.com/ALISOULEMOUANWIYA/oktopios/issues"

[project.scripts]
okp = "vm.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vm*"]

[tool.setuptools.package-data]
"*" = ["metadata/*.txt", "metadata/*.md", "vm/modules/*.okp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
